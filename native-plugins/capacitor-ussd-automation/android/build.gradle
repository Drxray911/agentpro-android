// This module's own buildscript classpath — deliberately NOT relying
// on the root project's buildscript to already have the Kotlin Gradle
// plugin available, since Capacitor's default generated root
// build.gradle (from `cap add`, which runs fresh on every CI build)
// only carries the Android Gradle Plugin classpath, not Kotlin's. A
// Gradle subproject can declare its own buildscript block independent
// of the root, which is what makes `apply plugin: 'kotlin-android'`
// below actually resolvable. Confirmed necessary the hard way: without
// this block, CI failed with "Plugin with id 'kotlin-android' not
// found", which in turn meant the android {} block below never even
// evaluated, cascading into a second, misleading "compileSdkVersion is
// not specified" error.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.agentpro.ussd"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        // TelephonyManager.sendUssdRequest() and
        // createForSubscriptionId() both require API 26 (Android 8.0).
        // This plugin cannot function below that, so it declares its
        // own floor here rather than silently degrading — Gradle will
        // fail the build loudly if the app-level minSdkVersion (set in
        // android/variables.gradle, regenerated on every `cap add`) is
        // lower than this, which is exactly why the CI workflow has an
        // explicit step bumping it to 26 after `cap add` runs.
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}
