name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build React web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Capacitor Android platform
        run: rm -rf android && npx cap add android

      - name: Raise minSdkVersion to 26 for USSD automation
        # android/variables.gradle is regenerated from Capacitor's
        # default template (minSdkVersion 22) every time `cap add`
        # runs above, so this can't be fixed by committing a changed
        # variables.gradle — it would just get overwritten again next
        # build. capacitor-ussd-automation's own build.gradle requires
        # API 26 (TelephonyManager.sendUssdRequest /
        # createForSubscriptionId aren't available below that), and
        # Gradle fails the whole build if the app-level minSdkVersion
        # is lower than a module it depends on, so this has to be
        # patched in after every regeneration, not once.
        run: sed -i 's/minSdkVersion = .*/minSdkVersion = 26/' android/variables.gradle

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agentpro-ghana-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
